<svg width="564" height="168" viewBox="0 0 564 168" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="huaweiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF001F"/>
      <stop offset="25%" stop-color="#FF4E00"/>
      <stop offset="50%" stop-color="#FF9A00"/>
      <stop offset="75%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#A6D600"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="564" height="168" rx="24" ry="24" fill="#000000"/>
  <!-- Huawei Petals -->
  <g transform="translate(48, 84)">
    <!-- Top petal -->
    <ellipse cx="0" cy="-22" rx="10" ry="22" fill="url(#huaweiGrad)" transform="rotate(0)"/>
    <!-- Top-right petal -->
    <ellipse cx="19" cy="-11" rx="10" ry="22" fill="url(#huaweiGrad)" transform="rotate(60 19 -11)"/>
    <!-- Bottom-right petal -->
    <ellipse cx="19" cy="11" rx="10" ry="22" fill="url(#huaweiGrad)" transform="rotate(120 19 11)"/>
    <!-- Bottom petal -->
    <ellipse cx="0" cy="22" rx="10" ry="22" fill="url(#huaweiGrad)" transform="rotate(180)"/>
    <!-- Bottom-left petal -->
    <ellipse cx="-19" cy="11" rx="10" ry="22" fill="url(#huaweiGrad)" transform="rotate(240 -19 11)"/>
    <!-- Top-left petal -->
    <ellipse cx="-19" cy="-11" rx="10" ry="22" fill="url(#huaweiGrad)" transform="rotate(300 -19 -11)"/>
  </g>
  <!-- Text lines -->
  <text x="200" y="60" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#AAAAAA" font-weight="400">GET IT ON</text>
  <text x="200" y="118" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#FFFFFF" font-weight="600">AppGallery</text>
</svg>